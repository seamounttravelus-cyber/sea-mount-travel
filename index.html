<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Sea & Mount Travel offers hotels in Digha, homestays in North Bengal and holiday packages.">
<title>Sea & Mount Travel | Hotels & Homestays</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:110px}
body{font-family:Arial,Helvetica,sans-serif;background:#f5f7f9;color:#222;line-height:1.6;overflow-x:hidden}
img{max-width:100%;display:block}
a{text-decoration:none}
button{font-family:inherit}

header{position:sticky;top:0;z-index:1000;background:#fff;box-shadow:0 2px 12px #0002}
.navbar{max-width:1200px;margin:auto;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.logo{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;color:#075e54;white-space:nowrap}
.logo img{width:55px;height:55px;object-fit:contain;border-radius:50%}
.logo b{color:#d89b16}
nav{display:flex;gap:22px;flex-wrap:wrap;justify-content:center}
nav a{color:#333;font-weight:600;font-size:15px}
nav a:hover{color:#075e54}

.hero{position:relative;height:620px;overflow:hidden;background:#111}
.hero-slide{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;animation:heroFade 16s infinite}
.hero-slide:nth-child(1){animation-delay:0s}
.hero-slide:nth-child(2){animation-delay:4s}
.hero-slide:nth-child(3){animation-delay:8s}
.hero-slide:nth-child(4){animation-delay:12s}
@keyframes heroFade{0%{opacity:0}8%{opacity:1}25%{opacity:1}33%{opacity:0}100%{opacity:0}}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(#0005,#0009);display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}
.hero-content{color:#fff;max-width:800px}
.hero-content h1{font-size:52px;margin-bottom:15px;text-shadow:0 3px 10px #0009}
.hero-content p{font-size:21px;text-shadow:0 2px 8px #000b}

section{padding:70px 20px}
.container{max-width:1200px;margin:auto}
.section-title{text-align:center;margin-bottom:40px}
.section-title h2{font-size:36px;color:#075e54;margin-bottom:8px}
.section-title p{color:#666}
.intro{background:#fff}
.intro-text{max-width:900px;margin:auto;text-align:center;font-size:18px;color:#555}

.property-section{background:#f5f7f9}
.red-section-heading{text-align:center;margin-bottom:40px}
.red-section-heading .top-line{display:block;font-size:30px;font-weight:700;color:#e53935;line-height:1.1;letter-spacing:1px}
.red-section-heading .bottom-line{display:block;font-size:38px;font-weight:800;color:#e53935;line-height:1.05;margin-top:3px}
.property-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:30px}
.property-card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 5px 20px #0002;transition:.3s}
.property-card:hover{transform:translateY(-5px);box-shadow:0 10px 28px #0003}
.property-image{height:330px;position:relative;overflow:hidden}
.slideshow{position:relative;width:100%;height:100%;overflow:hidden;background:#111;cursor:pointer}
.card-slide{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;animation:cardShow var(--duration) infinite;animation-delay:calc(var(--delay)*-1)}
@keyframes cardShow{0%{opacity:0;transform:scale(1)}8%{opacity:1;transform:scale(1.02)}75%{opacity:1;transform:scale(1.10)}92%{opacity:0;transform:scale(1.13)}100%{opacity:0;transform:scale(1)}}
.property-content{padding:24px}
.property-content h3{color:#075e54;font-size:25px;margin-bottom:8px}
.property-content h4{color:#d28d00;margin-bottom:12px}
.property-content p{color:#555;margin-bottom:10px}
.location{font-weight:600;color:#555}
.property-buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
